<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공공화장실 큐레이터 · 홈</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app home-app">

  <main class="map-area full" id="map-area" aria-label="주변 공공화장실 지도">

    <div class="map-overlay-top">
      <div class="search-row">
        <form role="search" class="floating-search" action="javascript:void(0)" id="search-form">
          <label for="home-search" class="sr-only">지역·화장실명 검색</label>
          <span aria-hidden="true">🔍</span>
          <input id="home-search" type="search" placeholder="지역 또는 화장실명 검색">
        </form>
        <button class="menu-fab" type="button" aria-label="메뉴">☰</button>
      </div>

      <div class="chip-scroll" id="type-chip-row">
        <button class="chip active" type="button" data-key="">전체</button>
        <button class="chip" type="button" data-key="hasStepFree">무장애</button>
        <button class="chip" type="button" data-key="hasAutoDoor">자동문</button>
        <button class="chip" type="button" data-key="hasDiaperTable">기저귀교환대</button>
        <button class="chip" type="button" data-key="hasBell">비상벨</button>
      </div>
    </div>

    <p class="note">지도 영역 · 상태별 핀<br><small>(Kakao Map SDK 연동 예정)</small></p>
    <div class="loc-dot" style="top:56%; left:48%"></div>
    <div id="pins"></div>

    <div class="pin-legend">
      <span><i style="background:var(--primary)"></i>개방</span>
      <span><i style="background:var(--faint)"></i>미확인</span>
      <span><i style="background:var(--danger)"></i>고장</span>
    </div>

    <button class="locate-fab" type="button" id="locate-btn" aria-label="현재 위치로 이동">⌖</button>
    <button class="list-fab" type="button" id="list-fab">목록으로 보기</button>
  </main>

  <nav class="app-tabbar" id="tabbar-root" aria-label="주요 메뉴"></nav>
</div>

<script src="./js/app.js"></script>
<script>
(async function () {
  App.renderTabbar(document.getElementById("tabbar-root"), "home");

  let activeKey = "";
  const chipRow = document.getElementById("type-chip-row");
  chipRow.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    activeKey = btn.dataset.key;
    chipRow.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
    btn.classList.add("active");
    applyPinFilter();
  });

  function buildParams(extra) {
    const params = new URLSearchParams();
    if (activeKey) params.set(activeKey, "1");
    const q = document.getElementById("home-search").value.trim();
    if (q) params.set("q", q);
    if (extra) Object.entries(extra).forEach(([k, v]) => params.set(k, v));
    return params;
  }

  document.getElementById("search-form").addEventListener("submit", () => {
    location.href = "pages/list.html?" + buildParams().toString();
  });
  document.getElementById("list-fab").addEventListener("click", () => {
    location.href = "pages/list.html?" + buildParams({ sort: "distance" }).toString();
  });
  document.getElementById("locate-btn").addEventListener("click", () => {
    // 실제 위치 권한 연동 전 자리: 현재는 지도 중심의 내 위치 점으로만 표시
    const dot = document.querySelector(".loc-dot");
    dot.animate(
      [{ transform: "translate(-50%,-50%) scale(1)" }, { transform: "translate(-50%,-50%) scale(1.6)" }, { transform: "translate(-50%,-50%) scale(1)" }],
      { duration: 500 }
    );
  });

  let allToilets = [];
  let pinEls = [];

  function applyPinFilter() {
    pinEls.forEach(({ el, toilet }) => {
      const match = !activeKey || toilet[activeKey];
      el.style.display = match ? "" : "none";
    });
  }

  try {
    allToilets = await App.loadToilets();
    const pinsEl = document.getElementById("pins");
    const positions = [
      { top: "34%", left: "22%" }, { top: "26%", left: "58%" },
      { top: "60%", left: "70%" }, { top: "68%", left: "20%" },
      { top: "44%", left: "80%" }, { top: "50%", left: "38%" },
      { top: "72%", left: "50%" },
    ];
    allToilets.slice(0, 7).forEach((t, i) => {
      const pin = document.createElement("div");
      const status = t.status || "open";
      pin.className = `map-pin status-${status}`;
      pin.style.top = positions[i % positions.length].top;
      pin.style.left = positions[i % positions.length].left;
      pin.title = `${t.name} · ${status === "open" ? "개방" : status === "broken" ? "고장" : "미확인"}`;
      pinsEl.appendChild(pin);
      pinEls.push({ el: pin, toilet: t });
    });
  } catch (err) {
    console.error(err);
  }
})();
</script>
</body>
</html>
