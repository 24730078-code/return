<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공공화장실 큐레이터 · 상세</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand-row">Restie</div>
    <div class="header-row">
      <button class="back-btn" type="button" onclick="history.length>1?history.back():location.href='./list.html'" aria-label="뒤로가기">←</button>
      <span class="header-title" id="h-title">불러오는 중…</span>
    </div>
  </header>

  <main class="content no-tabbar" id="content">
    <div class="hero-wrap">
      <div class="hero-img thumb" id="hero">이미지</div>
      <div class="hero-rv" id="hero-rv" hidden></div>
      <div class="hero-tabs" id="hero-tabs" hidden>
        <button type="button" class="on" data-m="map">지도</button>
        <button type="button" data-m="rv">로드뷰</button>
      </div>
      <div class="hero-msg" id="hero-msg" hidden>이 위치 근처에는 로드뷰가 없어요</div>
    </div>

    <div class="toast" id="toast" hidden>
      <span>즐겨찾기에 저장했습니다</span>
      <button type="button" onclick="location.href='./mypage.html?tab=favorites'">마이에서 보기</button>
    </div>

    <section>
      <div class="section-title">판단 정보 · 방문 전 꼭 확인</div>
      <div class="spec-grid" id="spec-grid" style="margin-top:10px"></div>
    </section>

    <section>
      <div class="section-title" style="margin-bottom:6px">보조 정보</div>
      <div class="info-row"><span class="label">주소</span><span id="v-address">-</span></div>
      <div id="info-extra"></div>
      <div class="info-row"><span class="label">변기 수</span><span id="v-count" class="gi-row">-</span></div>
      <div class="info-row"><span class="label">유아용 변기</span><span id="v-child" class="gi-row">-</span></div>
      <div class="info-row"><span class="label">정보 갱신일</span><span id="v-updated">-</span></div>
    </section>

    <section class="report-row">
      <span>청소도구 적치·고장을 발견했나요?</span>
      <a class="text-btn" id="report-link" href="./propose.html?mode=info&amp;item=broken">제보</a>
    </section>
    <section class="report-row">
      <span>이용하기 불편했거나 정보가 실제와 다른가요?</span>
      <a class="text-btn" id="propose-link" href="./propose.html">개선 제안</a>
    </section>
  </main>

  <div class="save-bar">
    <button class="save-btn" type="button" id="save-btn">☆ 즐겨찾기에 저장</button>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script src="../js/kakao-map.js"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");

  try {
    const toilets = await App.loadToilets();
    const t = toilets.find((x) => x.id === id);
    if (!t) throw new Error("not found");

    document.title = `공공화장실 큐레이터 · ${t.name}`;
    document.getElementById("h-title").innerHTML = `${t.name.replace(/</g, "&lt;")}${App.srcTag(t)}`;

    const yn = (v) => `<span class="spec-value ${v ? "yes" : "no"}">${v ? "있음" : "없음"}</span>`;
    const sub = (html) => (html ? `<span class="spec-sub">${html}</span>` : "");
    document.getElementById("spec-grid").innerHTML = `
      <div class="spec"><span class="spec-label">장애인화장실</span>${yn(t.hasStepFree)}${sub(t.hasStepFree ? `장애인용 ${t.disabledStalls}칸` : "")}</div>
      <div class="spec"><span class="spec-label">기저귀 교환대</span>${yn(t.hasDiaperTable)}${sub(App.placeHtml(t.diaperTableLocation))}</div>
      <div class="spec"><span class="spec-label">비상벨</span>${yn(t.hasBell)}${sub(App.placeHtml(t.bellLocation))}</div>
      <div class="spec"><span class="spec-label">CCTV</span>${yn(t.hasCctv)}</div>
      <div class="spec"><span class="spec-label">안심 시설 대상</span>${t.safetyFacilityTarget == null ? `<span class="spec-value no">정보 없음</span>` : yn(t.safetyFacilityTarget)}</div>
      <div class="spec"><span class="spec-label">운영시간</span><span class="spec-value">${t.openHours || "정보 없음"}</span></div>
    `;
    document.getElementById("v-address").textContent = t.address;
    // 개선 제안 페이지로 이 화장실을 미리 선택한 채 이동
    const pid = encodeURIComponent(t.id);
    document.getElementById("report-link").href = `./propose.html?id=${pid}&mode=info&item=broken`;
    document.getElementById("propose-link").href = `./propose.html?id=${pid}`;
    if (t.source === "api") {  // 서울시 API(지하철 역사) 전용 정보
      const row = (l, v) => (v ? `<div class="info-row"><span class="label">${l}</span><span>${v}</span></div>` : "");
      document.getElementById("info-extra").innerHTML =
        row("노선·역", `${t.lineName} ${t.station}역`) +
        row("위치", [t.groundType && `${t.groundType}${t.floor ? " " + t.floor + "층" : ""}`, t.gateType && `개찰구 ${t.gateType}`, t.exitNumber && `${t.exitNumber}번 출구 부근`].filter(Boolean).join(" · "));
    }
    document.getElementById("v-count").innerHTML =
      `${App.MALE_ICON}<b>${t.maleStalls}</b><span class="gi-dot">·</span>${App.FEMALE_ICON}<b>${t.femaleStalls}</b>`;
    // 유아용 변기: 남/여 아이콘으로 개수 표시 (위 '변기 수'에 포함된 개수)
    document.getElementById("v-child").innerHTML = t.maleChild + t.femaleChild === 0
      ? `<span class="gi-text">없음</span>`
      : `${App.MALE_ICON}<b>${t.maleChild}</b><span class="gi-dot">·</span>${App.FEMALE_ICON}<b>${t.femaleChild}</b>`;
    document.getElementById("v-updated").textContent = (t.updatedAt || "").slice(0, 10) || "정보 없음";

    // 위치: 카카오맵을 크게 확대해서 핀을 보여 준다 (키가 없거나 실패하면 기존 자리표시 유지)
    if (KakaoMap.hasKey()) {
      const hero = document.getElementById("hero");
      const placeholder = hero.textContent;
      hero.textContent = "";
      hero.classList.remove("thumb");
      KakaoMap.showOne(hero, t).then((ok) => {
        if (!ok) return fallbackHero(hero, placeholder);
        initHeroTabs(t);
      }).catch(() => fallbackHero(hero, placeholder));
    }
    // 지도 ↔ 로드뷰 전환 (우리 화면 안에서 카카오 로드뷰를 띄움)
    // 지도 영역을 누르면 메인 지도로 이동 (같은 화장실이 가운데에 오도록)
    document.getElementById("hero").addEventListener("click", () => {
      location.href = `../index.html?focus=${encodeURIComponent(t.id)}`;
    });
    document.getElementById("hero").style.cursor = "pointer";

    function initHeroTabs(t) {
      const tabs = document.getElementById("hero-tabs");
      const mapEl = document.getElementById("hero");
      const rvEl = document.getElementById("hero-rv");
      const msg = document.getElementById("hero-msg");
      let rv = null;
      const setTab = (m) => tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.m === m));
      tabs.hidden = false;
      tabs.addEventListener("click", async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.m === "map") {
          rvEl.hidden = true; mapEl.hidden = false; setTab("map");
          return;
        }
        rvEl.hidden = false; mapEl.hidden = true; setTab("rv");   // 먼저 보이게 해야 크기가 잡힘
        if (!rv) rv = await KakaoMap.openRoadview(rvEl, t);
        else rv.relayout();
        if (!rv) {                                                // 로드뷰가 없는 위치
          rvEl.hidden = true; mapEl.hidden = false; setTab("map");
          msg.hidden = false; setTimeout(() => (msg.hidden = true), 2500);
        }
      });
    }
    function fallbackHero(hero, text) { hero.innerHTML = ""; hero.classList.add("thumb"); hero.textContent = text; }

    const saveBtn = document.getElementById("save-btn");
    function syncSaveBtn() {
      const fav = App.isFavorite(t.id);
      saveBtn.classList.toggle("active", fav);
      saveBtn.textContent = fav ? "★ 저장됨" : "☆ 즐겨찾기에 저장";
    }
    syncSaveBtn();
    saveBtn.addEventListener("click", () => {
      const active = App.toggleFavorite(t.id);
      syncSaveBtn();
      const toast = document.getElementById("toast");
      toast.hidden = !active;
      toast.querySelector("span").textContent = active ? "즐겨찾기에 저장했습니다" : "즐겨찾기에서 제거했습니다";
      if (active) setTimeout(() => (toast.hidden = true), 2500);
    });

    App.addRecent(t.id);
  } catch (err) {
    content.innerHTML = `
      <div class="state-block">
        <div class="state-icon">⟳</div>
        <div class="state-title">화장실 정보를 불러오지 못했습니다</div>
        <div class="state-sub">목록으로 돌아가 다시 시도해 주세요</div>
        <a class="btn-secondary" href="./list.html">목록으로 돌아가기</a>
      </div>`;
    document.getElementById("h-title").textContent = "오류";
    console.error(err);
  }
})();
</script>
</body>
</html>
