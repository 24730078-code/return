<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공공화장실 큐레이터 · 상세</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* ---------- 맨 위: 사진 (예전 지도 자리, 크기 그대로) ----------
     화면 가로에 딱 붙게, 양옆 화살표로 넘김. 휴대폰에서는 손가락으로 밀어도 넘어감 */
  .photo-hero { position: absolute; inset: 0; overflow: hidden; background: #EEF0F1; touch-action: pan-y; }
  .photo-track { display: flex; height: 100%; transition: transform 0.3s ease; will-change: transform; }
  .photo-track img {
    flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; display: block;
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  .photo-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 34px; height: 34px; border: 0; border-radius: 50%; padding: 0;
    background: rgba(255, 255, 255, 0.9); box-shadow: 0 2px 8px rgba(27, 36, 34, 0.22);
    display: flex; align-items: center; justify-content: center; color: var(--pp-ink, #1F2A2E);
  }
  .photo-arrow svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .photo-arrow.prev { left: 12px; }
  .photo-arrow.next { right: 12px; }
  .photo-dots { position: absolute; left: 0; right: 0; bottom: 10px; z-index: 3; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
  .photo-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); box-shadow: 0 0 2px rgba(0, 0, 0, 0.25); }
  .photo-dots i.on { background: #fff; }

  /* ---------- 위치 및 상세 정보 아래: 지도 (지도 / 로드뷰) ---------- */
  .map-box { position: relative; height: 200px; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(20, 30, 40, 0.08); }
  .map-box .map-view { position: absolute; inset: 0; margin: 0; height: 100%; border-radius: 0; }
</style>
</head>
<body>
<div class="app detail-app">

  <header class="app-header">
    <div class="header-row">
      <button class="back-btn" type="button" onclick="history.length>1?history.back():location.href='./list.html'" aria-label="뒤로가기">←</button>
      <span class="header-title" id="h-title">불러오는 중…</span>
      <button class="fav-toggle" type="button" id="fav-star" aria-label="즐겨찾기에 저장" aria-pressed="false" hidden>☆</button>
    </div>
  </header>

  <main class="content no-tabbar" id="content">
    <!-- 맨 위: 사진 (사진 데이터가 없으면 '이미지' 자리표시) -->
    <div class="hero-wrap" id="photo-wrap" aria-roledescription="사진 넘기기">
      <div class="hero-img thumb" id="photo-empty">이미지</div>
    </div>

    <section>
      <div class="section-title">시설 및 이용 안내</div>
      <div class="spec-grid" id="spec-grid" style="margin-top:10px"></div>
    </section>

    <section>
      <div class="section-title" style="margin-bottom:6px">위치 및 상세 정보</div>
      <div class="info-row"><span class="label">주소</span><span id="v-address">-</span></div>
      <div id="info-extra"></div>
      <div class="info-row"><span class="label">변기 수</span><span id="v-count" class="gi-row">-</span></div>
      <div class="info-row"><span class="label">유아용 변기</span><span id="v-child" class="gi-row">-</span></div>
      <div class="info-row"><span class="label">정보 갱신일</span><span id="v-updated">-</span></div>
    </section>

    <!-- 지도 (예전 사진 자리) -->
    <section id="map-sec" hidden>
      <div class="map-box">
        <div class="hero-img thumb map-view" id="hero">지도</div>
        <div class="hero-rv" id="hero-rv" hidden></div>
        <div class="hero-tabs" id="hero-tabs" hidden>
          <button type="button" class="on" data-m="map">지도</button>
          <button type="button" data-m="rv">로드뷰</button>
        </div>
        <div class="hero-msg" id="hero-msg" hidden>이 위치 근처에는 로드뷰가 없어요</div>
      </div>
    </section>

    <section class="report-row">
      <span>이용하기 불편했거나 정보가 실제와 다른가요?</span>
      <a class="text-btn" id="propose-link" href="./propose.html">개선 제안</a>
    </section>
  </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script src="../js/kakao-map.js"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");

  try {
    const [toilets] = await Promise.all([App.loadToilets(), App.loadImageRules()]);
    const t = toilets.find((x) => x.id === id);
    if (!t) throw new Error("not found");

    document.title = `공공화장실 큐레이터 · ${t.name}`;
    document.getElementById("h-title").innerHTML = `${t.name.replace(/</g, "&lt;")}${App.srcTag(t)}`;

    const yn = (v) => `<span class="spec-value ${v ? "yes" : "no"}">${v ? "있음" : "없음"}</span>`;
    const sub = (html) => (html ? `<span class="spec-sub">${html}</span>` : "");
    document.getElementById("spec-grid").innerHTML = `
      <div class="spec"><span class="spec-label">장애인화장실</span>${yn(t.hasStepFree)}${sub(t.hasStepFree ? `장애인용 ${t.disabledStalls}칸` : "")}</div>
      <div class="spec"><span class="spec-label">기저귀 교환대</span>${yn(t.hasDiaperTable)}${sub(App.placeHtml(t.diaperTableLocation))}</div>
      <div class="spec"><span class="spec-label">비상벨</span>${yn(t.hasBell)}${sub(App.placeHtml(t.bellLocation))}</div>
      <div class="spec"><span class="spec-label">CCTV</span>${yn(t.hasCctv)}</div>
      <div class="spec"><span class="spec-label">안심 시설 대상</span>${t.safetyFacilityTarget == null ? `<span class="spec-value no">정보 없음</span>` : yn(t.safetyFacilityTarget)}</div>
      <div class="spec"><span class="spec-label">운영시간</span><span class="spec-value">${t.openHours || "정보 없음"}</span></div>
    `;
    document.getElementById("v-address").textContent = t.address;
    // 개선 제안 페이지로 이 화장실을 미리 선택한 채 이동
    const pid = encodeURIComponent(t.id);
    document.getElementById("propose-link").href = `./propose.html?id=${pid}`;
    if (t.source === "api") {  // 서울시 API(지하철 역사) 전용 정보
      const row = (l, v) => (v ? `<div class="info-row"><span class="label">${l}</span><span>${v}</span></div>` : "");
      document.getElementById("info-extra").innerHTML =
        row("노선·역", `${t.lineName} ${t.station}역`) +
        row("위치", [t.groundType && `${t.groundType}${t.floor ? " " + t.floor + "층" : ""}`, t.gateType && `개찰구 ${t.gateType}`, t.exitNumber && `${t.exitNumber}번 출구 부근`].filter(Boolean).join(" · "));
    }
    document.getElementById("v-count").innerHTML =
      `${App.MALE_ICON}<b>${t.maleStalls}</b><span class="gi-dot">·</span>${App.FEMALE_ICON}<b>${t.femaleStalls}</b>`;
    // 유아용 변기: 남/여 아이콘으로 개수 표시 (위 '변기 수'에 포함된 개수)
    document.getElementById("v-child").innerHTML = t.maleChild + t.femaleChild === 0
      ? `<span class="gi-text">없음</span>`
      : `${App.MALE_ICON}<b>${t.maleChild}</b><span class="gi-dot">·</span>${App.FEMALE_ICON}<b>${t.femaleChild}</b>`;
    document.getElementById("v-updated").textContent = (t.updatedAt || "").slice(0, 10) || "정보 없음";

    // 맨 위 사진 (예전 지도 자리)
    renderPhotos(App.imagesOf(t));

    // 지도 영역: 위쪽 영역들 크기는 그대로 두고 아래에 붙인다 (화면이 길어지면 스크롤)
    keepTopLayout(document.getElementById("map-sec"));

    // 지도: 카카오맵을 크게 확대해서 핀을 보여 준다 (키가 없거나 실패하면 '지도' 자리표시 유지)
    if (KakaoMap.hasKey()) {
      const hero = document.getElementById("hero");
      const placeholder = hero.textContent;
      hero.textContent = "";
      hero.classList.remove("thumb");
      KakaoMap.showOne(hero, t).then((ok) => {
        if (!ok) return fallbackHero(hero, placeholder);
        initHeroTabs(t);
      }).catch(() => fallbackHero(hero, placeholder));
    }
    // 지도 영역을 누르면 메인 지도로 이동 (같은 화장실이 가운데에 오도록)
    document.getElementById("hero").addEventListener("click", () => {
      location.href = `../index.html?focus=${encodeURIComponent(t.id)}`;
    });
    document.getElementById("hero").style.cursor = "pointer";

    // 지도 ↔ 로드뷰 전환 (우리 화면 안에서 카카오 로드뷰를 띄움)
    function initHeroTabs(t) {
      const tabs = document.getElementById("hero-tabs");
      const mapEl = document.getElementById("hero");
      const rvEl = document.getElementById("hero-rv");
      const msg = document.getElementById("hero-msg");
      let rv = null;
      const setTab = (m) => tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.m === m));
      tabs.hidden = false;
      tabs.addEventListener("click", async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.m === "map") {
          rvEl.hidden = true; mapEl.hidden = false; setTab("map");
          return;
        }
        rvEl.hidden = false; mapEl.hidden = true; setTab("rv");   // 먼저 보이게 해야 크기가 잡힘
        if (!rv) rv = await KakaoMap.openRoadview(rvEl, t);
        else rv.relayout();
        if (!rv) {                                                // 로드뷰가 없는 위치
          rvEl.hidden = true; mapEl.hidden = false; setTab("map");
          msg.hidden = false; setTimeout(() => (msg.hidden = true), 2500);
        }
      });
    }
    function fallbackHero(hero, text) { hero.innerHTML = ""; hero.classList.add("thumb"); hero.textContent = text; }

    // 즐겨찾기: 헤더 오른쪽 별을 눌러 저장/해제 (안내 문구 없이 별 모양만 바뀜)
    const star = document.getElementById("fav-star");
    function syncStar() {
      const fav = App.isFavorite(t.id);
      star.classList.toggle("active", fav);
      star.textContent = fav ? "★" : "☆";
      star.setAttribute("aria-pressed", fav ? "true" : "false");
      star.setAttribute("aria-label", fav ? "즐겨찾기에서 제거" : "즐겨찾기에 저장");
    }
    syncStar();
    star.hidden = false;
    star.addEventListener("click", () => {
      App.toggleFavorite(t.id);
      syncStar();
    });

    App.addRecent(t.id);
  } catch (err) {
    content.innerHTML = `
      <div class="state-block">
        <div class="state-icon">⟳</div>
        <div class="state-title">화장실 정보를 불러오지 못했습니다</div>
        <div class="state-sub">목록으로 돌아가 다시 시도해 주세요</div>
        <a class="btn-secondary" href="./list.html">목록으로 돌아가기</a>
      </div>`;
    document.getElementById("h-title").textContent = "오류";
    console.error(err);
  }

  /* ---------- 맨 위 사진: 가로에 딱 붙게, 화살표로 넘기기 ---------- */
  function renderPhotos(photos) {
    if (!photos.length) return;                       // 사진이 없으면 '이미지' 자리표시 그대로
    const wrap = document.getElementById("photo-wrap");
    const arrow = (dir) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${dir === "prev" ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7"}"/></svg>`;
    const many = photos.length > 1;
    wrap.innerHTML = `
      <div class="photo-hero">
        <div class="photo-track" id="photo-track">
          ${photos.map((p) => `<img src="${App.esc(p.src)}" alt="${App.esc(p.alt)}" draggable="false">`).join("")}
        </div>
      </div>
      ${many ? `
        <button type="button" class="photo-arrow prev" id="photo-prev" aria-label="이전 사진">${arrow("prev")}</button>
        <button type="button" class="photo-arrow next" id="photo-next" aria-label="다음 사진">${arrow("next")}</button>
        <div class="photo-dots" id="photo-dots">${photos.map(() => "<i></i>").join("")}</div>` : ""}`;
    if (!many) return;

    const track = document.getElementById("photo-track");
    const dots = [...document.querySelectorAll("#photo-dots i")];
    let cur = 0;
    function go(i) {
      cur = (i + photos.length) % photos.length;        // 마지막에서 다음 → 처음으로
      track.style.transform = `translateX(${-cur * 100}%)`;
      dots.forEach((d, k) => d.classList.toggle("on", k === cur));
      wrap.setAttribute("aria-label", `${photos[cur].alt} (${cur + 1}/${photos.length})`);
    }
    document.getElementById("photo-prev").addEventListener("click", () => go(cur - 1));
    document.getElementById("photo-next").addEventListener("click", () => go(cur + 1));
    // 휴대폰: 손가락으로 좌우로 밀면 넘어감
    let sx = null, sy = 0;
    wrap.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    wrap.addEventListener("touchend", (e) => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
    });
    go(0);
  }

  /* ---------- 위쪽 영역 크기 유지 ----------
     맨 위 영역(사진)은 원래 화면 높이에 맞춰 크기가 정해진다. 아래에 지도 영역을 붙이면 그만큼 줄어들기 때문에,
     지도 영역이 없을 때의 높이를 재서 고정한 뒤 지도 영역을 보여 준다. 늘어난 만큼은 아래로 스크롤된다. */
  function keepTopLayout(sec) {
    const top = document.getElementById("photo-wrap");
    function apply() {
      sec.hidden = true;
      top.style.flex = "";
      top.style.height = "";
      const h = top.getBoundingClientRect().height;
      top.style.flex = "0 0 auto";
      top.style.height = `${h}px`;
      sec.hidden = false;
    }
    apply();
    let timer = null;
    window.addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(apply, 150); });
  }
})();
</script>
</body>
</html>
