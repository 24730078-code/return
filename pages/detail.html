<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공공화장실 큐레이터 · 상세</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand-row">Restie</div>
    <div class="header-row">
      <button class="back-btn" type="button" onclick="history.length>1?history.back():location.href='./list.html'" aria-label="뒤로가기">←</button>
      <span class="header-title" id="h-title">불러오는 중…</span>
    </div>
  </header>

  <main class="content no-tabbar" id="content">
    <div class="hero-img thumb" id="hero">이미지</div>

    <div class="toast" id="toast" hidden>
      <span>즐겨찾기에 저장했습니다</span>
      <button type="button" onclick="location.href='./mypage.html?tab=favorites'">마이에서 보기</button>
    </div>

    <section>
      <div class="section-title">판단 정보 · 방문 전 꼭 확인</div>
      <div class="spec-grid" id="spec-grid" style="margin-top:10px"></div>
    </section>

    <section>
      <div class="section-title" style="margin-bottom:6px">보조 정보</div>
      <div class="info-row"><span class="label">주소</span><span id="v-address">-</span></div>
      <div class="info-row"><span class="label">운영시간</span><span id="v-hours">-</span></div>
      <div class="info-row"><span class="label">남녀분리</span><span id="v-gender">-</span></div>
      <div class="info-row"><span class="label">휴지·비누</span><span id="v-supplies">-</span></div>
    </section>

    <section class="report-row">
      <span>청소도구 적치·고장을 발견했나요?</span>
      <button class="text-btn" type="button" onclick="alert('이번 버전에서는 제보 기능이 준비 중입니다')">제보</button>
    </section>
  </main>

  <div class="save-bar">
    <button class="save-btn" type="button" id="save-btn">☆ 즐겨찾기에 저장</button>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");

  try {
    const toilets = await App.loadToilets();
    const t = toilets.find((x) => x.id === id);
    if (!t) throw new Error("not found");

    document.title = `공공화장실 큐레이터 · ${t.name}`;
    document.getElementById("h-title").textContent = t.name;

    const yn = (v) => `<span class="spec-value ${v ? "yes" : "no"}">${v ? "있음" : "없음"}</span>`;
    document.getElementById("spec-grid").innerHTML = `
      <div class="spec"><span class="spec-label">턱/계단</span>${yn(t.hasStepFree)}</div>
      <div class="spec"><span class="spec-label">자동문</span>${yn(t.hasAutoDoor)}</div>
      <div class="spec"><span class="spec-label">회전 공간(1.4m↑)</span>${yn(t.turnSpace)}</div>
      <div class="spec"><span class="spec-label">기저귀 교환대</span>${yn(t.hasDiaperTable)}</div>
      <div class="spec"><span class="spec-label">비상벨</span>${yn(t.hasBell)}</div>
      <div class="spec"><span class="spec-label">24시간 개방</span>${yn(App.isOpenNow(t))}</div>
    `;
    document.getElementById("v-address").textContent = t.address;
    document.getElementById("v-hours").textContent = `${t.openTime} – ${t.closeTime}`;
    document.getElementById("v-gender").textContent = t.genderSeparated ? "분리형" : "공용";
    document.getElementById("v-supplies").textContent = t.hasSupplies ? "비치됨" : "비치 안 됨";

    const saveBtn = document.getElementById("save-btn");
    function syncSaveBtn() {
      const fav = App.isFavorite(t.id);
      saveBtn.classList.toggle("active", fav);
      saveBtn.textContent = fav ? "★ 저장됨" : "☆ 즐겨찾기에 저장";
    }
    syncSaveBtn();
    saveBtn.addEventListener("click", () => {
      const active = App.toggleFavorite(t.id);
      syncSaveBtn();
      const toast = document.getElementById("toast");
      toast.hidden = !active;
      toast.querySelector("span").textContent = active ? "즐겨찾기에 저장했습니다" : "즐겨찾기에서 제거했습니다";
      if (active) setTimeout(() => (toast.hidden = true), 2500);
    });

    App.addRecent(t.id);
  } catch (err) {
    content.innerHTML = `
      <div class="state-block">
        <div class="state-icon">⟳</div>
        <div class="state-title">화장실 정보를 불러오지 못했습니다</div>
        <div class="state-sub">목록으로 돌아가 다시 시도해 주세요</div>
        <a class="btn-secondary" href="./list.html">목록으로 돌아가기</a>
      </div>`;
    document.getElementById("h-title").textContent = "오류";
    console.error(err);
  }
})();
</script>
</body>
</html>
