<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공공화장실 큐레이터 · 회원가입</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app propose-app auth-app">

  <header class="app-header auth-header">
    <div class="header-row">
      <button class="back-btn" type="button" onclick="history.length > 1 ? history.back() : (location.href = './mypage.html')" aria-label="뒤로가기">←</button>
      <span class="header-title">회원가입</span>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-intro">
      <strong>Restie와 함께 화장실을 바꿔요</strong>
      <p>가입하면 내 제안과 검토 결과를 확인할 수 있어요.</p>
    </div>

    <form class="auth-form2" id="signup-form" novalidate>
      <section class="sec-card auth-card2">
        <label class="field"><span>닉네임</span>
          <input name="nickname" maxlength="12" autocomplete="nickname" placeholder="2~12자">
        </label>
        <label class="field"><span>아이디(이메일)</span>
          <input name="email" type="email" inputmode="email" autocomplete="email" placeholder="example@email.com">
        </label>
        <label class="field"><span>비밀번호</span>
          <span class="auth-pw">
            <input id="su-pw" name="password" type="password" maxlength="16" autocomplete="new-password" placeholder="비밀번호 입력">
            <button class="auth-eye" type="button" data-eye="su-pw" aria-label="비밀번호 보기"></button>
          </span>
        </label>
        <p class="auth-hint">영문, 숫자, 특수문자를 조합해 입력해주세요. (8~16자)</p>
      </section>

      <section class="sec-card auth-card2 auth-agree">
        <label class="all"><input type="checkbox" id="agree-all"><span>전체 동의</span></label>
        <label><input type="checkbox" name="agree"><span>(필수) 서비스 이용약관</span></label>
        <label><input type="checkbox" name="agree"><span>(필수) 개인정보 수집 및 이용</span></label>
        <label><input type="checkbox" name="agree"><span>(필수) 위치 정보 이용</span></label>
      </section>

      <p class="form-error" id="signup-error" role="alert" hidden></p>
      <button class="auth-submit" type="submit">회원가입</button>
    </form>

    <p class="auth-switch">이미 계정이 있나요? <a href="./login.html">로그인</a></p>
  </main>
</div>

<script src="../js/app.js"></script>
<script>
(function () {
  /* 비밀번호 보기/숨기기 (눈 아이콘) */
  const EYE_OFF = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.5 4.2 9.5 6-.4.8-1.3 2-2.5 3.2M6.4 7.4C4.6 8.6 3.2 10.4 2.5 12c1 1.8 4.5 6 9.5 6 1.5 0 2.9-.4 4.1-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;
  const EYE_ON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12C3.5 10.2 7 6 12 6s8.5 4.2 9.5 6c-1 1.8-4.5 6-9.5 6s-8.5-4.2-9.5-6z"/><circle cx="12" cy="12" r="3"/></svg>`;
  document.querySelectorAll("[data-eye]").forEach((b) => {
    const input = document.getElementById(b.dataset.eye);
    b.innerHTML = EYE_OFF;
    b.addEventListener("click", (e) => {
      e.preventDefault();
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      b.innerHTML = show ? EYE_ON : EYE_OFF;
      b.setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보기");
    });
  });

  /* 전체 동의 ↔ 개별 동의 */
  const all = document.getElementById("agree-all");
  const items = [...document.querySelectorAll('input[name="agree"]')];
  all.addEventListener("change", () => items.forEach((c) => (c.checked = all.checked)));
  items.forEach((c) => c.addEventListener("change", () => (all.checked = items.every((x) => x.checked))));

  const form = document.getElementById("signup-form"), err = document.getElementById("signup-error");
  const showErr = (m) => { err.textContent = m; err.hidden = false; };
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(form));
    const pw = String(v.password || "");
    // 영문 + 숫자 + 특수문자 조합, 8~16자
    if (pw.length < 8 || pw.length > 16 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw) || !/[^A-Za-z0-9]/.test(pw))
      return showErr("비밀번호는 영문, 숫자, 특수문자를 조합해 8~16자로 입력해 주세요");
    if (items.some((c) => !c.checked)) return showErr("필수 약관에 모두 동의해 주세요");
    const btn = form.querySelector(".auth-submit");
    btn.disabled = true;
    const res = await App.Auth.signup({ nickname: v.nickname, email: v.email, password: pw, confirm: pw });
    btn.disabled = false;
    if (!res.ok) return showErr(res.error);
    // 가입만 하고 로그인 상태는 만들지 않음 → 로그인 페이지에서 직접 로그인
    App.Auth.logout();
    location.href = `./login.html?joined=1&email=${encodeURIComponent(String(v.email || "").trim())}`;
  });
})();
</script>
</body>
</html>
