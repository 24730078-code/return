<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공공화장실 큐레이터 · 로그인</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app propose-app auth-app">

  <header class="app-header auth-header">
    <div class="header-row">
      <button class="back-btn" type="button" onclick="history.length > 1 ? history.back() : (location.href = './mypage.html')" aria-label="뒤로가기">←</button>
      <span class="header-title">로그인</span>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-intro">
      <strong id="login-title">다시 만나서 반가워요</strong>
      <p id="login-sub">이메일과 비밀번호로 로그인해 주세요.</p>
    </div>

    <form class="sec-card auth-card2" id="login-form" novalidate>
      <label class="field"><span>아이디(이메일)</span>
        <input name="email" type="email" inputmode="email" autocomplete="email" placeholder="example@email.com">
      </label>
      <label class="field"><span>비밀번호</span>
        <span class="auth-pw">
          <input id="login-pw" name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력">
          <button class="auth-eye" type="button" data-eye="login-pw" aria-label="비밀번호 보기"></button>
        </span>
      </label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="auth-submit" type="submit">로그인</button>
      <div class="auth-links">
        <button type="button" data-find>아이디 찾기</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-find>비밀번호 찾기</button>
      </div>
    </form>

    <p class="auth-switch">아직 회원이 아니신가요? <a href="./signup.html">회원가입</a></p>
  </main>
</div>

<script src="../js/app.js"></script>
<script>
(function () {
  /* 비밀번호 보기/숨기기 (눈 아이콘) */
  const EYE_OFF = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.5 4.2 9.5 6-.4.8-1.3 2-2.5 3.2M6.4 7.4C4.6 8.6 3.2 10.4 2.5 12c1 1.8 4.5 6 9.5 6 1.5 0 2.9-.4 4.1-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;
  const EYE_ON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12C3.5 10.2 7 6 12 6s8.5 4.2 9.5 6c-1 1.8-4.5 6-9.5 6s-8.5-4.2-9.5-6z"/><circle cx="12" cy="12" r="3"/></svg>`;
  document.querySelectorAll("[data-eye]").forEach((b) => {
    const input = document.getElementById(b.dataset.eye);
    b.innerHTML = EYE_OFF;
    b.addEventListener("click", (e) => {
      e.preventDefault();
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      b.innerHTML = show ? EYE_ON : EYE_OFF;
      b.setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보기");
    });
  });

  document.querySelectorAll("[data-find]").forEach((b) =>
    b.addEventListener("click", () => alert("데모 버전에서는 아직 지원하지 않아요.")));

  const form = document.getElementById("login-form"), err = document.getElementById("login-error");

  /* 회원가입을 마치고 넘어온 경우: 안내 문구를 바꾸고 이메일을 미리 채워 둠 */
  const q = new URLSearchParams(location.search);
  if (q.get("joined") === "1") {
    document.getElementById("login-title").textContent = "가입을 환영해요";
    document.getElementById("login-sub").textContent = "가입한 이메일과 비밀번호로 로그인해 주세요.";
    if (q.get("email")) form.email.value = q.get("email");
    form.password.focus();
  }
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(form));
    if (!v.email || !v.password) { err.textContent = "아이디와 비밀번호를 입력해 주세요"; err.hidden = false; return; }
    const btn = form.querySelector(".auth-submit");
    btn.disabled = true;
    const res = await App.Auth.login(v);
    btn.disabled = false;
    if (!res.ok) { err.textContent = res.error; err.hidden = false; return; }
    location.href = "./mypage.html";
  });
})();
</script>
</body>
</html>
