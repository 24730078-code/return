<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="화장실 세면대">
  <rect width="640" height="480" fill="#F4F9FC"/>
  <!-- 벽 타일 -->
  <g stroke="#DCEBF5" stroke-width="2">
    <path d="M0 60 H640 M0 120 H640 M0 180 H640 M0 240 H640 M0 300 H640"/>
    <path d="M80 0 V300 M160 0 V300 M240 0 V300 M320 0 V300 M400 0 V300 M480 0 V300 M560 0 V300"/>
  </g>
  <!-- 거울 -->
  <rect x="60" y="50" width="160" height="150" rx="10" fill="#D6ECF8" stroke="#A9D4EC" stroke-width="4"/>
  <rect x="240" y="50" width="160" height="150" rx="10" fill="#D6ECF8" stroke="#A9D4EC" stroke-width="4"/>
  <rect x="420" y="50" width="160" height="150" rx="10" fill="#D6ECF8" stroke="#A9D4EC" stroke-width="4"/>
  <g stroke="#FFFFFF" stroke-width="6" opacity=".7" stroke-linecap="round">
    <path d="M90 90 L130 70 M265 100 L315 75 M450 95 L495 72"/>
  </g>
  <!-- 세면대 상판 -->
  <rect x="30" y="250" width="580" height="34" rx="6" fill="#FFFFFF" stroke="#B9DDF0" stroke-width="3"/>
  <rect x="40" y="284" width="560" height="110" fill="#E3F1FA"/>
  <g fill="#C9E4F4"><rect x="60" y="300" width="160" height="80" rx="6"/><rect x="240" y="300" width="160" height="80" rx="6"/><rect x="420" y="300" width="160" height="80" rx="6"/></g>
  <!-- 볼 -->
  <g fill="#F0F7FC" stroke="#A9D4EC" stroke-width="3">
    <ellipse cx="140" cy="262" rx="52" ry="10"/><ellipse cx="320" cy="262" rx="52" ry="10"/><ellipse cx="500" cy="262" rx="52" ry="10"/>
  </g>
  <!-- 수도꼭지 -->
  <g fill="#8FB3C8">
    <rect x="135" y="222" width="10" height="30" rx="4"/><rect x="125" y="222" width="30" height="8" rx="4"/>
    <rect x="315" y="222" width="10" height="30" rx="4"/><rect x="305" y="222" width="30" height="8" rx="4"/>
    <rect x="495" y="222" width="10" height="30" rx="4"/><rect x="485" y="222" width="30" height="8" rx="4"/>
  </g>
  <!-- 비누 -->
  <rect x="195" y="230" width="18" height="22" rx="4" fill="#7CC8EE"/><rect x="200" y="222" width="8" height="10" rx="2" fill="#5FA9D6"/>
  <!-- 바닥 -->
  <rect y="394" width="640" height="86" fill="#DCEBF5"/>
  <g stroke="#CDE2EF" stroke-width="2"><path d="M0 437 H640 M160 394 V480 M320 394 V480 M480 394 V480"/></g>
</svg>
