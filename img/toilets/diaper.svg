<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="벽에 설치된 접이식 기저귀 교환대">
  <rect width="640" height="480" fill="#F4F9FC"/>
  <g stroke="#DCEBF5" stroke-width="2"><path d="M0 90 H640 M0 180 H640 M0 270 H640 M0 360 H640 M128 0 V390 M256 0 V390 M384 0 V390 M512 0 V390"/></g>
  <!-- 교환대 벽면 본체 -->
  <rect x="190" y="110" width="260" height="70" rx="12" fill="#5FA9D6"/>
  <!-- 펼쳐진 상판 -->
  <path d="M175 180 H465 L500 255 H140Z" fill="#9FCFEA"/>
  <path d="M140 255 H500 V275 Q500 285 490 285 H150 Q140 285 140 275Z" fill="#7FB3D1"/>
