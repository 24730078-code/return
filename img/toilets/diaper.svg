  <rect x="470" y="110" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#7CC8EE" stroke-width="2"/>
  <text x="530" y="139" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#2F5873" text-anchor="middle">기저귀 교환대</text>
  <!-- 휴지통 -->
  <rect x="80" y="310" width="56" height="70" rx="8" fill="#BFE2F4"/><rect x="74" y="302" width="68" height="12" rx="6" fill="#9FCFEA"/>
  <rect y="390" width="640" height="90" fill="#DCEBF5"/>
</svg>
